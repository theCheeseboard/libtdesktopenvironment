[workspace]
resolver = "3"
members = ["tdesktopenvironment"]


[workspace.dependencies]
gpui = "*"
indexmap = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
locale_config = "*"
syn = "2"
once_cell = "1"
icu = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust-embed = { version = "8.7.2", features = ["include-exclude"] }
clap-cargo = { version = "0.15", features = ["cargo_metadata"] }
rustc-hash = "2"
chrono = "0.4"
directories = "6"
contemporary = { git = "https://github.com/vicr123/contemporary-rs" }
cntp_i18n = { git = "https://github.com/vicr123/contemporary-rs", features = ["gpui"] }
cntp_icon_tool_macros = { git = "https://github.com/vicr123/contemporary-rs" }
cntp_i18n_gen = { git = "https://github.com/vicr123/contemporary-rs" }
zbus = "5"